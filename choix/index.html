<style>
  /* Charte Cutora pour l'interface de la page */
  :root {
    --c-bg: #1A1A1A; --c-txt: #FDFBF7; --c-cu: #B87333; --c-cu-h: #D08B44; --c-cu-d: #5C3A18; --c-nav: #1F355E;
    --c-tc: #D96236; --c-sec: #141A26; --c-card: #212121; --c-hi: #241C13; --c-noir: #0D0D0D; --c-line: #2E2E2E;
    --c-line-cu: #4A3323; --c-t2: #D5D1CA; --c-t3: #C9C5BE; --c-lbl: #8A8A8A; --c-bleu: #4A6EA5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--c-bg); color: var(--c-txt); font-family: "Montserrat", sans-serif; font-weight: 400; }
  header { position: sticky; top: 0; z-index: 20; background: rgba(13,13,13,0.94); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--c-line); padding: 12px 28px; display: flex; align-items: center; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 12px; text-transform: uppercase; font-weight: 800; letter-spacing: .08em; font-size: 14px; white-space: nowrap; }
  .brand img { width: 38px; height: auto; }
  .brand span { color: var(--c-cu); }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .steps button { background: none; border: 1px solid var(--c-line); color: var(--c-lbl); border-radius: 99px; padding: 5px 11px;
    font: 700 10px "Montserrat"; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
  .steps button.done { color: var(--c-t2); border-color: var(--c-line-cu); }
  .steps button.on { border-color: var(--c-cu); color: var(--c-txt); background: var(--c-hi); }
  main { max-width: 1280px; margin: 0 auto; padding: 30px 28px 150px; }
  .kicker { color: var(--c-cu); font: 700 11px "Montserrat"; text-transform: uppercase; letter-spacing: .14em; margin: 0 0 8px; }
  h1 { font: 800 30px/1.15 "Montserrat"; text-transform: uppercase; letter-spacing: .01em; margin: 0 0 10px; }
  h2 { font: 800 16px "Montserrat"; text-transform: uppercase; letter-spacing: .06em; margin: 34px 0 14px; color: var(--c-t2); }
  .lead { color: var(--c-t3); font-size: 15px; font-weight: 300; margin: 0 0 26px; max-width: 820px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 18px; }
  .card { background: var(--c-card); border: 1.5px solid var(--c-line); border-radius: 16px; padding: 10px; cursor: pointer;
    transition: border-color .15s, transform .15s, background .15s; }
  .card:hover { transform: translateY(-2px); border-color: var(--c-line-cu); }
  .card.sel { border-color: var(--c-cu); background: var(--c-hi); box-shadow: 0 0 0 3px rgba(184,115,51,.22); }
  .card h3 { margin: 12px 4px 4px; font: 700 14px "Montserrat"; text-transform: uppercase; letter-spacing: .03em; }
  .card p { margin: 0 4px 6px; color: var(--c-t3); font-size: 12.5px; line-height: 1.5; font-weight: 400; }
  .pill { display: inline-block; font: 700 9px "Montserrat"; padding: 3px 7px; border-radius: 5px; margin: 0 0 0 6px; vertical-align: 2px;
    letter-spacing: .08em; text-transform: uppercase; }
  .pill.reco { background: var(--c-nav); color: var(--c-txt); }
  .pill.sel { background: var(--c-cu); color: var(--c-cu-d); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(13,13,13,0.96); border-top: 1px solid var(--c-line);
    padding: 14px 28px; display: flex; gap: 12px; justify-content: center; z-index: 20; }
  .btn { border: 0; border-radius: 10px; padding: 13px 22px; font: 700 13px "Montserrat"; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
  .btn.main { background: var(--c-cu); color: var(--c-cu-d); }
  .btn.main:hover { background: var(--c-cu-h); }
  .btn.ghost { background: var(--c-card); color: var(--c-txt); border: 1px solid var(--c-line); }
  .btn.ghost:hover { border-color: var(--c-line-cu); }
  .btn:disabled { opacity: .35; cursor: default; }
  .note { background: var(--c-sec); border: 1px solid var(--c-nav); border-radius: 12px; padding: 14px 16px; color: var(--c-t2); font-size: 14px; line-height: 1.55; }
  .ok { background: var(--c-hi); border: 1px solid var(--c-cu); border-radius: 12px; padding: 14px 16px; margin-top: 16px; color: var(--c-txt); display: none; }
  textarea, input[type=text] { width: 100%; background: var(--c-card); border: 1px solid var(--c-line); color: var(--c-txt);
    border-radius: 10px; padding: 13px; font: 400 15px "Montserrat"; resize: vertical; }
  textarea:focus, input[type=text]:focus { outline: none; border-color: var(--c-cu); }
  label.lbl { display: block; font: 700 11px "Montserrat"; text-transform: uppercase; letter-spacing: .1em; color: var(--c-lbl); margin: 22px 0 8px; }
  code { font-family: "JetBrains Mono", monospace; color: var(--c-cu-h); }

  /* Couleurs de marque et polices composées */
  .brandbox, .compose { display: grid; grid-template-columns: 1fr 230px; gap: 26px; background: var(--c-sec); border: 1px solid var(--c-nav); border-radius: 16px; padding: 22px; margin-top: 30px; }
  .crow { display: grid; grid-template-columns: 150px 64px 140px 40px; gap: 12px; align-items: center; margin-bottom: 12px; }
  .crow .role { font: 700 12px "Montserrat"; text-transform: uppercase; letter-spacing: .06em; color: var(--c-t2); }
  .crow .role small { display: block; font: 400 11px "Montserrat"; text-transform: none; letter-spacing: 0; color: var(--c-lbl); margin-top: 2px; }
  .swatch { position: relative; width: 64px; height: 44px; border-radius: 10px; border: 2px solid var(--c-line); overflow: hidden; cursor: pointer; display: block; }
  .swatch:hover { border-color: var(--c-cu); }
  .swatch input { position: absolute; inset: -10px; width: 90px; height: 70px; border: 0; padding: 0; cursor: pointer; }
  .crow input[type=text] { padding: 11px; font: 700 14px "JetBrains Mono", monospace; text-transform: uppercase; }
  .crow input[type=text].bad { border-color: var(--c-tc); }
  .del { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--c-line); background: var(--c-card); color: var(--c-lbl); font-size: 18px; cursor: pointer; }
  .fontrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { border: 1.5px solid var(--c-line); background: var(--c-card); color: var(--c-txt); border-radius: 10px; padding: 9px 13px; cursor: pointer; font-size: 17px; }
  .chip:hover { border-color: var(--c-line-cu); }
  .chip.sel { border-color: var(--c-cu); background: var(--c-hi); }
  .recap { display: grid; grid-template-columns: 250px 1fr; gap: 28px; align-items: start; }
  .recap table { width: 100%; border-collapse: collapse; }
  .recap td { padding: 9px 6px; border-bottom: 1px solid var(--c-line); font-size: 14px; vertical-align: top; }
  .recap td:first-child { color: var(--c-lbl); width: 190px; font: 700 11px "Montserrat"; text-transform: uppercase; letter-spacing: .08em; padding-top: 12px; }

  /* Écran d'aperçu : ses variables viennent de l'option qu'il montre */
  .scr { position: relative; width: 100%; aspect-ratio: 9 / 16; border-radius: 12px; overflow: hidden; background: var(--bg); color: var(--fg); container-type: inline-size; }
  .scr.h { aspect-ratio: 16 / 9; }
  .scr .lay { position: absolute; inset: 0; }
  .gridbg { position: absolute; inset: 0; background-image: linear-gradient(var(--gl) 1px, transparent 1px), linear-gradient(90deg, var(--gl) 1px, transparent 1px);
    background-size: 8cqw 8cqw; -webkit-mask-image: radial-gradient(circle at 50% 38%, #000 18%, transparent 72%); mask-image: radial-gradient(circle at 50% 38%, #000 18%, transparent 72%); }
  .ttl { position: absolute; left: 8%; right: 8%; top: 7%; line-height: 1.04; z-index: 3; }
  .weak { font-family: var(--ft), sans-serif; font-weight: var(--ftw); font-size: calc(var(--ts) * .55); opacity: .92; margin-bottom: .2em; }
  .strong { font-family: var(--ff), sans-serif; font-weight: var(--fw); text-transform: var(--fmaj); font-size: var(--ts); letter-spacing: -0.02em; }
  .w { display: inline-block; }
  .mk { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 .04em .06em; }
  .acc-c { color: var(--acc); }
  .acc-f { font-family: var(--fa), serif; font-weight: var(--faw); font-style: var(--fai); text-transform: none; letter-spacing: 0; }
  .acc-p { background: var(--acc); color: var(--onacc); padding: 0 .12em; border-radius: .12em; }
  .acc-u { position: relative; }
  .acc-u .ul { position: absolute; left: 0; right: 0; bottom: -.08em; height: .1em; background: var(--acc); transform-origin: left; display: block; }
  .mz { position: absolute; z-index: 2; }
  .tile { position: absolute; border-radius: 1.6cqw; background: var(--tile); border: 1px solid var(--tileb); overflow: hidden; }
  .tile .ln { position: absolute; left: 10%; height: 7%; border-radius: 3px; background: var(--tileb); }
  .tag { position: absolute; background: var(--acc); color: var(--onacc); font: 800 4.6cqw var(--ff), sans-serif; padding: .4em .6em; border-radius: .35em; white-space: nowrap; z-index: 4; }
  .cap { position: absolute; left: 0; right: 0; text-align: center; z-index: 6; }
  .cap-one span { position: absolute; left: 0; right: 0; font: var(--fw) 8.5cqw var(--ff), sans-serif; text-transform: var(--fmaj); color: #fff; text-shadow: 0 .4cqw 1.5cqw rgba(0,0,0,.6); }
  .cap-kara { font: 700 5cqw var(--ft), sans-serif; color: #fff; padding: 0 8%; text-shadow: 0 .4cqw 1.5cqw rgba(0,0,0,.6); }
  .cap-kara span { display: inline-block; margin: 0 .12em; }
  .cap-band span { position: absolute; left: 12%; right: 12%; background: #000; color: #fff; font: 700 4.4cqw "JetBrains Mono", monospace; padding: .5em 0; border-radius: 1cqw; }
  .cap-geant small { display: block; font: 600 4cqw var(--ft), sans-serif; color: #fff; }
  .cap-geant b { display: block; font: var(--fw) 13cqw var(--ff), sans-serif; text-transform: uppercase; color: var(--acc); line-height: 1; }
  .cap-cls { font: 500 4cqw var(--ft), sans-serif; color: #fff; text-shadow: 0 .3cqw 1cqw #000; }
  .cam { position: absolute; border-radius: 3cqw; overflow: visible; }
  .cam .clip { position: absolute; inset: 0; border-radius: 3cqw; overflow: hidden; background: linear-gradient(160deg, #3b3d46, #23252c); }
  .person { position: absolute; }
  .person svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .phone { position: absolute; border-radius: 4cqw; border: 1cqw solid #3a3a40; background: #0f0f12; overflow: hidden; }
  .halo { position: absolute; border-radius: 50%; background: var(--acc); filter: blur(7cqw); opacity: .55; }
  .big { font-family: var(--ff), sans-serif; font-weight: var(--fw); text-transform: var(--fmaj); }
  .rv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .phone .rv ~ div { display: none; }
  .shade { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,0) 34%, rgba(0,0,0,0) 58%, rgba(0,0,0,.66)); z-index: 1; }
  .eq { display: flex; gap: 4px; align-items: center; height: 46%; }
  .eq i { width: 5px; border-radius: 3px; background: var(--acc); display: block; }
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const by = (list, id) => list.find((x) => x.id === id);
const nm = (list, id) => (by(list, id) || {}).nom || "à définir";
const lum = (hex) => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };
const okHex = (h) => /^#?[0-9a-f]{6}$/i.test(h.trim());
const normHex = (h) => "#" + h.trim().replace("#", "").toUpperCase();

// Le style complet vu par un aperçu : la direction, puis les choix faits, puis l'option montrée
function resolve(over = {}, sansEtat = false) {
  const d = by(DIRECTIONS, over.direction || state.direction) || DIRECTIONS[0];
  const o = JSON.parse(JSON.stringify(d.set));
  if (!sansEtat) {
    for (const k of KEYS) { const v = state[k]; if (v != null && !(Array.isArray(v) && !v.length)) o[k] = JSON.parse(JSON.stringify(v)); }
    if (state.customOn && state.custom) o.custom = [...state.custom];
    if (state.fonts) o.fonts = { ...state.fonts };
  }
  Object.assign(o, over);
  if ("palette" in over) delete o.custom;
  if ("pair" in over || !o.fonts) o.fonts = { ...(by(PAIRS, o.pair) || PAIRS[0]).f };
  return o;
}
function colors(o) {
  const c = o.custom || (by(PALETTES, o.palette) || PALETTES[0]).c;
  const bg = c[0], acc = c[1] || "#B87333", acc2 = c[2] || acc, light = lum(bg) > 0.5;
  return { bg, acc, acc2, fg: light ? "#151515" : "#FDFBF7", light, onacc: lum(acc) > 0.6 ? "#111111" : "#FFFFFF" };
}
function vars(o) {
  const c = colors(o), F = (k) => FONTS[o.fonts[k]] || FONTS.montserrat;
  const ff = F("fort"), ft = F("texte"), fa = F("accent"), k = (by(TAILLES, o.taille) || TAILLES[1]).k;
  return `--bg:${c.bg};--fg:${c.fg};--acc:${c.acc};--acc2:${c.acc2};--onacc:${c.onacc};--gl:${c.light ? "rgba(0,0,0,.07)" : "rgba(255,255,255,.07)"};` +
    `--tile:${c.light ? "rgba(0,0,0,.05)" : "rgba(255,255,255,.07)"};--tileb:${c.light ? "rgba(0,0,0,.14)" : "rgba(255,255,255,.18)"};` +
    `--ff:'${ff.fam}';--fw:${ff.w};--fmaj:${ff.maj ? "uppercase" : "none"};--ft:'${ft.fam}';--ftw:${ft.w};--fa:'${fa.fam}';--faw:${fa.w};--fai:${fa.it ? "italic" : "normal"};` +
    `--ts:${(9.5 * k).toFixed(2)}cqw;`;
}
const speed = (o) => (by(RYTHMES, o.rythme) || RYTHMES[1]).v;
const cssVar = (el, n) => getComputedStyle(el).getPropertyValue(n).trim();

/* ===== Aperçus : registre des animations ===== */
let TLS = [], REG = new Map(), UID = 0;
const FIGER = new URLSearchParams(location.search).has("t") ? +new URLSearchParams(location.search).get("t") : null; // pour les captures de contrôle
const reg = (fn) => { const id = "a" + UID++; REG.set(id, fn); return id; };
function initAnims(scope) {
  if (!window.gsap) return;
  $$("[data-tl]", scope).forEach((el) => {
    const fn = REG.get(el.dataset.tl); if (!fn) return;
    try { const tl = fn(el); if (tl) { el._tl = tl; TLS.push(tl); if (FIGER != null) tl.pause(FIGER); } } catch (e) { console.error(e); window.__erreurs = (window.__erreurs || 0) + 1; }
  });
}
function killAnims(scope) { $$("[data-tl]", scope).forEach((el) => { if (el._tl) el._tl.kill(); }); }
function mount(container, html) { killAnims(container); container.innerHTML = html; initAnims(container); videosVisibles(container); }

/* Vraies vidéos (choix/media, téléchargées à l'installation). Absentes : silhouettes dessinées. */
let MEDIA = new Set();
const V = (nom, pos = "50% 30%") => MEDIA.has(nom) ? `<video class="rv" src="media/${nom}.mp4" muted autoplay loop playsinline preload="auto" style="object-position:${pos}"></video>` : "";
const VU = (nom) => MEDIA.has(nom);
let OBS = null;
function videosVisibles(scope) {
  if (!OBS) OBS = new IntersectionObserver((es) => es.forEach((e) => { const v = e.target; if (e.isIntersecting) v.play().catch(() => {}); else v.pause(); }), { rootMargin: "100px" });
  $$("video.rv", scope).forEach((v) => OBS.observe(v));
}

/* Titre avec mots faibles, mots forts et mot clé */
function titleHtml(o, l1 = ["Les", "3", "outils"], l2 = [["qui", 0], ["changent", 0], ["tout", 1]]) {
  const acc = { "couleur-italique": "acc-c acc-f", couleur: "acc-c", italique: "acc-f", pave: "acc-p", souligne: "acc-u" }[o.accent] || "acc-c acc-f";
  const wrap = (txt, cls) => {
    let inner = o.textanim === "machine" ? [...txt].map((c) => `<span class="ch">${c}</span>`).join("") : txt;
    if (cls.includes("acc-u")) inner += '<i class="ul"></i>';
    const w = `<span class="w ${cls}">${inner}</span>`;
    return o.textanim === "masque" ? `<span class="mk">${w}</span>` : w;
  };
  return `<div class="ttl"><div class="weak">${l1.map((t) => wrap(t, "")).join(" ")}</div><div class="strong">${l2.map(([t, a]) => wrap(t, a ? acc : "")).join(" ")}</div></div>`;
}
function animText(tl, root, kind, t, sp) {
  const ws = $$(".ttl .w", root), st = 0.17 * sp;
  if (!ws.length) return t;
  let end;
  if (kind === "machine") {
    const ch = $$(".ttl .ch", root);
    tl.set(ch, { opacity: 0 }, 0).to(ch, { opacity: 1, duration: 0.01, stagger: 0.055 * sp }, t);
    end = t + ch.length * 0.055 * sp;
  } else {
    if (kind === "glisse") tl.fromTo(ws, { opacity: 0, y: "0.9em" }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: st }, t);
    else if (kind === "masque") tl.fromTo(ws, { yPercent: 115 }, { yPercent: 0, duration: 0.5, ease: "power4.out", stagger: st }, t);
    else if (kind === "pop") tl.fromTo(ws, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(3)", stagger: st }, t);
    else tl.fromTo(ws, { opacity: 0, filter: "blur(8px)", y: "0.3em", scale: 0.92 }, { opacity: 1, filter: "blur(0px)", y: 0, scale: 1, duration: 0.45, ease: "power3.out", stagger: st }, t);
    end = t + ws.length * st + 0.4;
  }
  const ul = $$(".ttl .ul", root);
  if (ul.length) tl.fromTo(ul, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, end);
  return end;
}

/* Sous-titres */
const CAPW = ["je", "vais", "te", "montrer", "le", "secret"];
function capHtml(o, top) {
  const s = `style="top:${top}%"`;
  switch (o.captions) {
    case "mot-unique": return `<div class="cap cap-one" ${s}>${CAPW.map((w) => `<span>${w}</span>`).join("")}</div>`;
    case "karaoke": return `<div class="cap cap-kara" ${s}>${CAPW.map((w) => `<span>${w}</span>`).join(" ")}</div>`;
    case "bandeau": return `<div class="cap cap-band" ${s}><span>JE VAIS TE</span><span>MONTRER LE SECRET</span></div>`;
    case "mot-geant": return `<div class="cap cap-geant" ${s}><small>je vais te montrer le</small><b>secret</b></div>`;
    case "classique": return `<div class="cap cap-cls" style="top:${Math.max(top, 86)}%">Je vais te montrer le secret</div>`;
    default: return "";
  }
}
function animCap(tl, root, kind, t, dur) {
  const cap = $(".cap", root); if (!cap) return;
  const sp = $$("span", cap), slot = dur / 6;
  if (kind === "mot-unique") {
    tl.set(sp, { opacity: 0 }, 0);
    sp.forEach((s, i) => { tl.fromTo(s, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.08 }, t + i * slot); if (i < 5) tl.set(s, { opacity: 0 }, t + (i + 1) * slot); });
  } else if (kind === "karaoke") {
    const acc = cssVar(root, "--acc");
    tl.set(sp, { color: "#ffffff", scale: 1 }, 0).fromTo(cap, { opacity: 0 }, { opacity: 1, duration: 0.2 }, t);
    sp.forEach((s, i) => { tl.set(s, { color: acc, scale: 1.1 }, t + i * slot).set(s, { color: "#ffffff", scale: 1 }, t + (i + 1) * slot); });
  } else if (kind === "bandeau") {
    tl.set(sp, { opacity: 0 }, 0).set(sp[0], { opacity: 1 }, t).set(sp[0], { opacity: 0 }, t + dur / 2).set(sp[1], { opacity: 1 }, t + dur / 2);
  } else if (kind === "mot-geant") {
    tl.fromTo($("small", cap), { opacity: 0 }, { opacity: 1, duration: 0.2 }, t).fromTo($("b", cap), { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.5)" }, t + slot * 4);
  } else if (kind === "classique") {
    tl.fromTo(cap, { opacity: 0 }, { opacity: 1, duration: 0.4 }, t);
  }
}

/* Croquis sonore (Web Audio) */
let actx = null;
function ecouter(m) {
  if (!m.notes.length) return;
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  const t0 = actx.currentTime + 0.05, beat = 60 / m.bpm, out = actx.createGain(), f = (n) => 440 * Math.pow(2, (n - 69) / 12);
  out.gain.value = 0.18; out.connect(actx.destination);
  for (let i = 0; i < 16; i++) {
    const t = t0 + i * beat / 2, n = m.notes[i % m.notes.length], o = actx.createOscillator(), g = actx.createGain();
    o.type = m.id === "energique" ? "sawtooth" : m.id === "suspense" ? "triangle" : "sine";
    o.frequency.value = f(m.id === "suspense" ? n - 12 : n);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(m.id === "calme" ? 0.5 : 0.8, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + (m.id === "calme" ? 1.4 : 0.28));
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 1.5);
    if (m.id === "energique" && i % 2 === 0) {
      const k = actx.createOscillator(), kg = actx.createGain();
      k.frequency.setValueAtTime(120, t); k.frequency.exponentialRampToValueAtTime(40, t + 0.15);
      kg.gain.setValueAtTime(1, t); kg.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      k.connect(kg); kg.connect(out); k.start(t); k.stop(t + 0.25);
    }
  }
  if (m.id !== "energique") {
    const p = actx.createOscillator(), pg = actx.createGain();
    p.frequency.value = f(m.notes[0] - 12); pg.gain.setValueAtTime(0, t0); pg.gain.linearRampToValueAtTime(0.35, t0 + 1); pg.gain.linearRampToValueAtTime(0, t0 + 8 * beat);
    p.connect(pg); pg.connect(out); p.start(t0); p.stop(t0 + 8 * beat + 0.1);
  }
}

}

$("#prev").onclick = () => go(state.step - 1);
$("#skip").onclick = () => { const k = STEPS[state.step].id; state.passe = [...new Set([...state.passe, k])]; log(k, "passé"); go(state.step + 1); };
$("#auto").onclick = () => {
  const k = STEPS[state.step].id;
  if (k === "direction") applyDirection("cutora");
  else if (k === "son") { state.musique = recoFor("musique"); state.sfx = recoFor("sfx"); }
  else if (k === "palette") { state.palette = recoFor("palette"); state.customOn = false; }
  else if (k === "pair") { state.pair = recoFor("pair"); state.fonts = null; }
  else state[k] = JSON.parse(JSON.stringify(recoFor(k)));
  state.choisi_pour_moi = [...new Set([...state.choisi_pour_moi, k])]; log(k, "choisi pour moi");
  go(state.step + 1);
};
$("#next").onclick = () => { saveText(); if (STEPS[state.step].id === "recap") return enregistrer(); go(state.step + 1); };

async function enregistrer() {
  const o = resolve(), c = colors(o), hes = {};
  state.journal.forEach((j) => { if (!/passé|écouté|choisi/.test(j.valeur)) hes[j.etape] = (hes[j.etape] || 0) + 1; });
  const fnt = (r) => { const x = FONTS[o.fonts[r]]; return { police: x.fam, graisse: x.w, italique: !!x.it, capitales: !!x.maj }; };
  const data = { version: 2, date: new Date().toISOString().slice(0, 10), nom_style: state.nom_style || "mon-style", depart: state.depart,
    ambiance: state.direction || "cutora", format: o.format,
    couleurs: { fond: c.bg, forte: c.acc, secondaire: c.acc2, texte: c.fg, toutes: o.custom || (by(PALETTES, o.palette) || {}).c, source: o.custom ? "marque" : o.palette },
    polices: { forte: fnt("fort"), normale: fnt("texte"), accent: fnt("accent"), association: state.fonts ? "composée" : o.pair },
    taille_titres: o.taille, mot_cle: o.accent, sous_titres: o.captions, apparition_texte: o.textanim, transitions: o.transition, rythme: o.rythme,
    motion_design: o.motion, musique: o.musique, bruitages: o.sfx,
    references: state.refs.split(/\s+/).filter((x) => x.startsWith("http")), ses_mots: state.mots, note: state.note,
    etapes_passees: state.passe, choisi_pour_moi: state.choisi_pour_moi,
    vraiment_choisi: KEYS.filter((k) => isDone(k) && !state.passe.includes(k) && !state.choisi_pour_moi.includes(k)),
    hesitations: Object.fromEntries(Object.entries(hes).filter(([, n]) => n > 1)), parcours: state.journal,
    etat: { ...state, step: 0, journal: [] } };
  const ok = $("#ok");
  try {
    const r = await fetch("/enregistrer", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data, null, 2) });
    if (!r.ok) throw new Error(r.status);
    ok.innerHTML = "<b>C'est enregistré.</b> Tu peux fermer cette page et revenir dans Claude : il prépare ta planche de style avec ton propre contenu.";
  } catch (e) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })); a.download = "choix.json"; a.click();
    ok.innerHTML = "<b>Le fichier choix.json vient d'être téléchargé.</b> Dis à Claude qu'il est dans ton dossier Téléchargements.";
  }
  ok.style.display = "block";
}

/* Démarrage : reprendre un style existant si le serveur en donne un, ou aller à une étape (?etape=) */
(async () => {
  try { const r = await fetch("media/liste.json"); if (r.ok) MEDIA = new Set(await r.json()); } catch (e) {}
  try { const r = await fetch("/etat.json"); if (r.ok) { const s = await r.json(); if (s && s.etat) Object.assign(state, s.etat, { journal: [], step: 1 }); } } catch (e) {}
  const q = new URLSearchParams(location.search);
  if (q.get("direction")) applyDirection(q.get("direction"));
  if (q.get("etape")) { const i = STEPS.findIndex((x) => x.id === q.get("etape")); if (i >= 0) state.step = i; }
  if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]);
  render();
})();
</script>
